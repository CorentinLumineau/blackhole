name: Release Cadence

# Every-N-merged-PR release cut (N = CADENCE_THRESHOLD in scripts/lib/release-cadence.ts).
# On by default. Owner kill switch: repository variable RELEASE_CADENCE_ENABLED == 'false'
# (see documentation/runbooks/release-cadence.md).
# A package.json already above the latest tag cuts early, below the threshold.
# When disabled, `disabled-notice` surfaces a warning so skips are not silent.
#
# The cut job commits notes, bumps VERSIONED_MANIFESTS, and pushes an annotated v* tag.
# A tag pushed with GITHUB_TOKEN starts no new workflow run, so the `publish` job calls
# .github/workflows/release.yml (workflow_call) for the new tag. release.yml stays the
# sole publisher.

on:
  schedule:
    # Every 2 hours, at :17 to stay off the top-of-hour cron rush.
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Cut release even when N < CADENCE_THRESHOLD (maintainer emergency)"
        type: boolean
        default: false

# One cut at a time; a running cut is never cancelled. GitHub keeps only one
# pending run per group, so a queued force=true dispatch can be superseded by
# the next cron run (which then skips if < N PRs). If that happens, dispatch
# force=true again once the running cut finishes.
concurrency:
  group: release-cadence
  cancel-in-progress: false

jobs:
  disabled-notice:
    if: vars.RELEASE_CADENCE_ENABLED == 'false'
    name: cadence-disabled (notice)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Surface disabled bootstrap gate
        run: |
          echo "::warning title=Release Cadence disabled::RELEASE_CADENCE_ENABLED is 'false' (owner kill switch). Every-N-PR cuts are skipped. Re-enable by deleting the variable — see documentation/runbooks/release-cadence.md. Agents must not set this variable."

  cut:
    if: vars.RELEASE_CADENCE_ENABLED != 'false'
    name: cut-release (gate + prepare + tag)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.cut.outputs.tag }}
    permissions:
      contents: write        # git push main + release tag
      pull-requests: read    # gh api repos/.../pulls
      issues: write          # file/comment the persistent-failure tracking issue
      actions: read          # Verify workflow conclusion on the tip SHA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - name: Fetch tags
        run: git fetch --tags --force origin

      # A run checks out github.sha, the main tip when the run was created.
      # A run that queued for hours can start after another cut landed.
      # Skip instead of failing: the next schedule cuts from the live tip.
      - name: Skip a run that main has outrun
        id: fresh
        run: |
          git fetch --quiet origin main
          live=$(git rev-parse origin/main)
          if [ "$live" != "${{ github.sha }}" ]; then
            echo "::notice title=Release Cadence superseded::Created on ${{ github.sha }}, main is now $live. Skipping; the next schedule (or a new dispatch) cuts from the live tip."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-bun
        if: steps.fresh.outputs.stale == 'false'

      - name: bun install --frozen-lockfile
        if: steps.fresh.outputs.stale == 'false'
        run: bun install --frozen-lockfile

      # Optional Haiku notes: CLAUDE_CODE_OAUTH_TOKEN is passed only to this step.
      # If the secret is absent, the CLI install is skipped and notes stay deterministic.
      # A failed/timed-out/invalid model call never fails the cut.
      - name: Cut release (gate + notes + optional Haiku + tag)
        id: cut
        if: steps.fresh.outputs.stale == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          CI: true
          RELEASE_CADENCE_ENABLED: ${{ vars.RELEASE_CADENCE_ENABLED }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          # Install is best-effort: a failed CLI fetch must not block the cut.
          # Deterministic notes are the fallback (scripts/release-cadence.ts).
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            prefix="${RUNNER_TEMP:-/tmp}/claude-code"
            if npm i --prefix "$prefix" @anthropic-ai/claude-code@2.1.296; then
              export PATH="$prefix/node_modules/.bin:$PATH"
            else
              echo "::warning title=Haiku notes skipped::Claude Code install failed; cadence will use deterministic notes."
            fi
          fi
          ARGS=(--cut)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            ARGS+=(--force)
          fi
          before=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          bun run release-cadence "${ARGS[@]}"
          after=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -n "$after" ] && [ "$after" != "$before" ]; then
            echo "tag=$after" >> "$GITHUB_OUTPUT"
          fi

      - name: Close the failing-cut issue
        if: success() && steps.fresh.outputs.stale == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = "release-cadence cut is failing on main";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "blackhole/backlog",
              per_page: 100,
            });
            const existing = open.find(
              (issue) => !issue.pull_request && issue.title === title,
            );
            if (!existing) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: `A later cut succeeded: ${runUrl}. Closing.`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              state: "closed",
              state_reason: "completed",
            });
            core.notice(`Closed tracking issue #${existing.number}`);

      - name: Report failing cut
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = "release-cadence cut is failing on main";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The release-cadence cut job failed.`,
              ``,
              `Failing run: ${runUrl}`,
              ``,
              `No release will be cut until this is fixed — see documentation/runbooks/release-cadence.md.`,
              ``,
              `Pareto: gain=8 effort=3 priority=64`,
            ].join("\n");

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "blackhole/backlog",
              per_page: 100,
            });
            const existing = open.find(
              (issue) => !issue.pull_request && issue.title === title,
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.notice(`Commented on existing tracking issue #${existing.number}`);
              return;
            }

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["blackhole/backlog"],
            });
            core.notice(`Opened tracking issue #${created.data.number}`);

  # A tag pushed with GITHUB_TOKEN does not trigger release.yml's `push: tags`,
  # so the cadence calls it directly for the tag it just pushed.
  publish:
    needs: cut
    if: needs.cut.outputs.tag != ''
    name: publish-release
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.cut.outputs.tag }}
