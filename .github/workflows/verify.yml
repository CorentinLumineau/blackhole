name: Verify

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

# Cancel superseded in-progress runs on the same branch/PR, but never cancel a tag run
# (a release build must complete).
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    name: Protocol Conformance
    # Skip on tag pushes: release.yml already runs build + verify for tags, and the
    # release-notes-gate job below covers the tag-specific check. Avoids a duplicate
    # full build+verify on a tag.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    # pull_request runs attacker-controllable fork code — never schedule it on the self-hosted
    # runner (public repo). Trusted push/tag events keep the self-hosted MacBook runner.
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted", "mba"]') }}
    # The self-hosted runner is one slot of a pool shared across repos, so a wedged job holds
    # that slot until it is reaped. GitHub's default ceiling is 360 minutes; observed real
    # durations here are 245s-1055s (PR runs on ubuntu-latest: 43-54s). 40 minutes covers the
    # 10-minute mba-slot wait below plus ~1.7x the worst run actually seen.
    timeout-minutes: 40
    # Environment rather than `git config --global`: on the self-hosted Mac that would rewrite
    # the owner's own git identity. Several bun:test fixtures (scripts/lib/test-fixtures.ts) run
    # `git commit` against a throwaway repo; with no identity that commit fails with "Author
    # identity unknown".
    env:
      GIT_AUTHOR_NAME: blackhole-ci
      GIT_AUTHOR_EMAIL: ci@blackhole.local
      GIT_COMMITTER_NAME: blackhole-ci
      GIT_COMMITTER_EMAIL: ci@blackhole.local

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Machine-wide FIFO ticket shared by every repo on the Mac. A short wait, so a busy host
      # fails this job visibly instead of eating the whole timeout.
      - name: Acquire MBA slot
        if: runner.environment == 'self-hosted'
        run: |
          command -v mba-slot >/dev/null 2>&1 || { echo "mba-slot absent; running unmetered"; exit 0; }
          mba-slot acquire --timeout 600

      # Must run before "Run build" below: scripts/verify.hooks.test.ts reads the git-tracked
      # bundle trees straight off disk, with no build self-invocation, to assert the committed
      # mirrors match their sources. A build earlier in this same job would silently regenerate
      # a stale mirror before that assertion runs, turning it into a tautology that passes
      # whether or not the committed output is actually in sync.

      # `bun run test` carries --timeout 60000 (package.json), not bun's 5000ms default. Many
      # test files here spawn subprocesses and a few shell out to a full build or a full verify
      # run; those finish well under a second on an idle machine, but were measured crossing
      # 5000ms on this self-hosted runner, which runs them while the rest of the suite competes
      # for the same cores. 5000ms was acting as a performance assertion those tests never meant
      # to make — 60000ms is a deadlock guard instead. The tradeoff is accepted deliberately: a
      # genuinely hung test now takes a minute to fail rather than five seconds.
      # bunfig.toml's [test] timeout key is NOT a substitute — bun 1.4.2 parses it without error
      # and ignores it, so the CLI flag is the only lever that actually takes effect.
      - name: Run test suite
        run: bun run test

      # Build once here; verify below skips its internal build (VERIFY_SKIP_BUILD) so the
      # build runs exactly once, and the sync-check still diffs a fresh build.
      - name: Run build
        run: bun run build

      - name: Run verify
        run: bun run verify
        env:
          VERIFY_SKIP_BUILD: "1"

      - name: Verify build is in sync
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Error: Uncommitted changes after build. Run 'bun run build' locally."
            git diff
            exit 1
          fi

      - name: Run install:verify
        run: bun run install:verify

      # Claude Code plugin schema gate (2.1.295+). `claude plugin validate --strict` is a local
      # static check; `claude plugin test` runs only when the plugin ships a tests/ tree.
      # GitHub-hosted PR runners do not preinstall the CLI; self-hosted push already has it.
      # Pin the npm package — `install.sh` latest can change --strict semantics under our feet.
      - name: Setup Claude Code CLI
        if: runner.environment != 'self-hosted'
        run: |
          npm i -g @anthropic-ai/claude-code@2.1.296
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"

      - name: Validate Claude plugin (strict)
        run: |
          set -euo pipefail
          claude plugin validate --strict .
          claude plugin validate --strict plugins/blackhole-claude
          if [ -d plugins/blackhole-claude/tests ] || [ -d tests ]; then
            claude plugin test
          fi

      - name: Release MBA slot
        if: always() && runner.environment == 'self-hosted'
        run: command -v mba-slot >/dev/null 2>&1 && mba-slot release || true

  release-notes-gate:
    name: Release Notes Gate
    # Checkout plus a shell existence check — seconds of real work, not worth a shared Mac slot.
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # The ceiling is here to bound a hang, not to pace the work.
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release notes file exists
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Skipping gate for non-semver tag: $TAG"
            exit 0
          fi
          if [ "$(git cat-file -t "refs/tags/$TAG" 2>/dev/null || echo missing)" != "tag" ]; then
            echo "Skipping gate for lightweight tag: $TAG"
            exit 0
          fi
          if [ ! -f ".github/releases/${TAG}.md" ]; then
            echo "Error: Missing .github/releases/${TAG}.md for annotated tag ${TAG}."
            echo "Run: bun run release prepare ${TAG}"
            echo "See: .github/skills/create-release/SKILL.md"
            exit 1
          fi
          echo "Release notes file present for ${TAG}"
