name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release
    # GitHub-hosted, like every workflow in this repo.
    runs-on: ubuntu-latest
    # Observed release durations are 32s-1011s; 30 minutes bounds a wedge without pacing the work.
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Build
        run: bun run build

      - name: Run Verify
        run: bun run verify
        env:
          VERIFY_SKIP_BUILD: "1"

      - name: Verify build is in sync (Quality Gate)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Error: Uncommitted changes detected after build! Please run 'bun run build' locally and commit all changes."
            git diff
            exit 1
          fi

      - name: Resolve release notes
        id: notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          NOTES_FILE=".github/releases/${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "source=file" >> "$GITHUB_OUTPUT"
            echo "title=${TAG}" >> "$GITHUB_OUTPUT"
            {
              echo 'body<<EOF'
              cat "$NOTES_FILE"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo "source=git-cliff" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Changelog
        if: steps.notes.outputs.source == 'git-cliff'
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ steps.notes.outputs.source == 'file' && format('{0} — Release', steps.notes.outputs.title) || '' }}
          body: ${{ steps.notes.outputs.source == 'file' && steps.notes.outputs.body || steps.git-cliff.outputs.content }}
          draft: false
          prerelease: false
