name: Setup Bun
description: >-
  Provide the pinned Bun version: installs that version and caches the global install cache on
  GitHub-hosted runners.

inputs:
  bun-version:
    description: >-
      Bun version installed on the runner.
    required: false
    default: "1.4.2"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Cache bun install
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-
