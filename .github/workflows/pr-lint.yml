name: PR lint
# Mechanical PR checks that used to be review prose: issue link (V-GIT-01),
# main base or a live stack (V-STACK-01), no unstacked overlap (V-STACK-02). Script: scripts/pr-lint.sh.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: pr-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-lint:
    name: pr-lint
    # Same fork rule as verify.yml: fork PRs stay on ubuntu-latest, same-repo PRs use mba.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "mba"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint PR metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          READY_LABEL: ready
        run: bash scripts/pr-lint.sh
